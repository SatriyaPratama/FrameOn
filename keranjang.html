<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-container {
            max-width: 900px;
            margin: 8rem auto 0 auto;
            padding: 2rem;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .cart-item {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 1.5rem 0;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .cart-item:hover {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 0 -1.5rem 1rem -1.5rem;
        }

        .cart-item img {
            width: 120px;
            height: 100px;
            object-fit: contain;
            border-radius: 8px;
            background: #f5f5f5;
            padding: 0.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-info h4 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--neutral-dark);
            margin-bottom: 0.5rem;
        }

        .cart-item-info p {
            color: var(--neutral-medium);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .cart-item-info p:first-of-type {
            font-weight: 600;
            color: var(--primary);
        }

        .qty-controls {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 0.5rem;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .qty-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .qty-btn.minus:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            padding: 0.5rem;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .remove-btn:hover {
            background: var(--accent);
            color: white;
        }

        .cart-summary {
            margin-top: 2rem;
            border-top: 2px solid #eee;
            padding-top: 2rem;
            background: #f8f9fa;
            border-radius: var(--radius);
            padding: 2rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .summary-row span:first-child {
            color: var(--neutral-medium);
        }

        .summary-row span:last-child {
            font-weight: 600;
            color: var(--neutral-dark);
        }

        .total-row {
            border-top: 1px solid #ddd;
            padding-top: 1rem;
            margin-top: 1rem;
            font-size: 1.3rem;
        }

        .total-row span {
            color: var(--neutral-dark);
            font-weight: 700;
        }

        .total-row span:last-child {
            color: var(--primary);
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .checkout-form input,
        .checkout-form select {
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .checkout-form input:focus,
        .checkout-form select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
            outline: none;
        }

        .voucher-section {
            display: flex;
            gap: 1rem;
        }

        .voucher-section input {
            flex: 1;
        }

        .voucher-btn {
            padding: 1rem 2rem;
            background: var(--success);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .voucher-btn:hover {
            background: var(--success-dark);
            transform: translateY(-2px);
        }

        .checkout-btn {
            background: var(--primary);
            color: white;
            padding: 1.2rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 86, 179, 0.4);
        }

        .empty-cart {
            text-align: center;
            padding: 3rem;
            color: var(--neutral-medium);
        }

        .empty-cart a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .empty-cart a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cart-container {
                margin: 0 1rem;
                padding: 1.5rem;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }

            .cart-item img {
                width: 100px;
                height: 80px;
            }

            .voucher-section {
                flex-direction: column;
                gap: 1rem;
            }

            .summary-row {
                font-size: 1rem;
            }

            .total-row {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html"><img src="images/logo.png" class="logo" alt="FrameOn Logo"></a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="produk.html">Produk</a></li>
        </ul>
    </header>

    <div class="container">
        <div class="cart-container">
            <h2>Keranjang Belanja Anda</h2>
            <div id="cartItems"></div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="cartSubtotal">Rp0</span>
                </div>
                <div class="summary-row">
                    <span>Diskon:</span>
                    <span id="cartDiscount">-</span>
                </div>
                <div class="summary-row">
                    <span>Ongkir:</span>
                    <span>Gratis</span>
                </div>
                <div class="summary-row total-row">
                    <span>Total:</span>
                    <span id="cartTotal">Rp0</span>
                </div>
            </div>

            <form class="checkout-form">
                <input type="text" placeholder="Alamat Pengiriman" required>
                <select required aria-label="Metode Pembayaran">
                    <option value=""disabled selected hidden>Pilih Metode Pembayaran</option>
                    <option value="cod">Bayar di Tempat (COD)</option>
                    <option value="transfer">Transfer Bank</option>
                    <option value="qris">QRIS</option>
                </select>
                <div class="voucher-section">
                    <input type="text" id="voucherCode" placeholder="Kode Voucher">
                    <button type="button" id="applyVoucher" class="voucher-btn">Terapkan</button>
                </div>
                <button type="submit" class="checkout-btn">Bayar Sekarang</button>
            </form>
        </div>
    </div>

    <script src="dist/Produk.js"></script>
</body>

</html>
